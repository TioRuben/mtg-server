<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0f14">
<title>MTG · Iberia</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0b0f14; color: #e6edf3;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input { font: inherit; }
  #viewport { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
  #image { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform;
    user-select: none; -webkit-user-drag: none; image-rendering: auto; visibility: hidden; }
  #hud { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: flex-start;
    justify-content: space-between; gap: .75rem; padding: calc(.7rem + env(safe-area-inset-top)) 1rem .6rem;
    background: linear-gradient(rgba(11,15,20,.85), rgba(11,15,20,0)); pointer-events: none; z-index: 3; }
  #hud h1 { font-size: .95rem; font-weight: 600; letter-spacing: .02em; }
  #time { display: block; margin-top: .2rem; font-size: .82rem; color: #9fb0c0; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 1rem; background: rgba(11,15,20,.92); z-index: 4;
    text-align: center; padding: 2rem; transition: opacity .3s; }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlay p { font-size: .95rem; color: #c8d4df; max-width: 26rem; line-height: 1.5; }
  #overlay .error { color: #ff8f8f; }
  .spinner { width: 2.6rem; height: 2.6rem; border-radius: 50%; border: 3px solid #22303e;
    border-top-color: #58a6ff; animation: spin 1s linear infinite; }
  .spinner.paused { animation: none; border-top-color: #22303e; }
  #controls { position: fixed; left: 50%; bottom: calc(1rem + env(safe-area-inset-bottom));
    transform: translateX(-50%); width: min(38rem, calc(100vw - 1.25rem)); padding: .75rem .85rem;
    border: 1px solid rgba(159,176,192,.2); border-radius: 1rem; background: rgba(11,15,20,.82);
    backdrop-filter: blur(18px); z-index: 3; display: flex; align-items: center; gap: .75rem; }
  #transport { position: relative; display: flex; align-items: center; gap: .45rem; flex-shrink: 0; }
  .transport-button { width: 2.75rem; height: 2.75rem; border: 0; border-radius: 999px; padding: 0;
    background: #16202a; color: #e6edf3; display: grid; place-items: center; line-height: 0; }
  .transport-button.primary { background: #1f6feb; }
  .transport-button svg { width: 1.3rem; height: 1.3rem; display: block; fill: currentColor; }
  #transport.loading .transport-button { visibility: hidden; }
  .transport-status { font-size: .68rem; color: #9fb0c0; white-space: nowrap; position: absolute; left: 50%;
    top: 50%; transform: translate(-50%, -50%); pointer-events: none; max-width: 92%; overflow: hidden;
    text-overflow: ellipsis; }
  #timeline-slider { flex: 1; accent-color: #58a6ff; min-width: 0; }
  #frame-label { min-width: 3.5rem; text-align: right; font-size: .8rem; color: #9fb0c0; font-variant-numeric: tabular-nums; }
  #copyright-button { width: 1.6rem; height: 1.6rem; font-size: .8rem; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 640px) {
    #hud { flex-direction: column; gap: .15rem; }
    #controls { width: calc(100vw - 1rem); gap: .55rem; padding: .7rem .75rem; }
    .transport-button { width: 2.55rem; height: 2.55rem; }
    #frame-label { min-width: 2.8rem; font-size: .76rem; }
  }
  #copyright-dialog { position: fixed; inset: 0; z-index: 5; display: flex; align-items: center;
    justify-content: center; padding: 1.5rem; background: rgba(11,15,20,.75); }
  #copyright-dialog.hidden { display: none; }
  #copyright-dialog .dialog-box { max-width: 26rem; background: #101720; border: 1px solid rgba(159,176,192,.2);
    border-radius: .85rem; padding: 1.25rem 1.4rem; font-size: .85rem; line-height: 1.5; color: #c8d4df; }
  #copyright-dialog h2 { font-size: .95rem; margin-bottom: .6rem; color: #e6edf3; }
  #copyright-dialog p { margin-bottom: .75rem; }
  #copyright-dialog a { color: #58a6ff; }
  #copyright-dialog .dialog-close { margin-top: .25rem; width: 100%; padding: .5rem; border: 0;
    border-radius: .5rem; background: #1f6feb; color: #fff; }
</style>
</head>
<body>
<header id="hud">
  <h1>MTG · Iberia</h1>
  <span id="time"></span>
</header>
<div id="viewport">
  <img id="image" alt="Meteosat Third Generation true-color image of the Iberian Peninsula and the Balearic Islands" draggable="false">
</div>
<div id="controls">
  <div id="transport">
    <button class="transport-button" id="previous" aria-label="Previous frame"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
    <button class="transport-button primary" id="play-pause" aria-label="Play animation"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="transport-button" id="next" aria-label="Next frame"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
    <span class="transport-status" id="transport-status" hidden></span>
    <button class="transport-button" id="copyright-button" aria-label="Copyright information">&copy;</button>
  </div>
  <input id="timeline-slider" type="range" min="0" max="0" value="0" step="1" aria-label="Timeline" aria-describedby="frame-label">
  <span id="frame-label" role="status" aria-live="polite" aria-atomic="true">Frame 0 of 0</span>
</div>
<div id="overlay">
  <div class="spinner" id="spinner"></div>
  <p id="message">Contacting the server…</p>
</div>
<div id="copyright-dialog" class="hidden" role="dialog" aria-modal="true" aria-labelledby="copyright-title">
  <div class="dialog-box">
    <h2 id="copyright-title">Copyright</h2>
    <p>Contains modified Copernicus Sentinel data / EUMETSAT MTG data, processed by this service.</p>
    <p>Source code: <a href="https://github.com/TioRuben/mtg-server" target="_blank" rel="noopener noreferrer">github.com/TioRuben/mtg-server</a></p>
    <button class="dialog-close" id="copyright-close">Close</button>
  </div>
</div>
<script>
(() => {
  const viewport = document.getElementById('viewport');
  const image = document.getElementById('image');
  const overlay = document.getElementById('overlay');
  const message = document.getElementById('message');
  const spinner = document.getElementById('spinner');
  const timeLabel = document.getElementById('time');
  const previousButton = document.getElementById('previous');
  const playPauseButton = document.getElementById('play-pause');
  const nextButton = document.getElementById('next');
  const slider = document.getElementById('timeline-slider');
  const frameLabel = document.getElementById('frame-label');
  const transport = document.getElementById('transport');
  const transportStatus = document.getElementById('transport-status');
  const copyrightButton = document.getElementById('copyright-button');
  const copyrightDialog = document.getElementById('copyright-dialog');
  const copyrightClose = document.getElementById('copyright-close');

  const PLAY_ICON = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
  const PAUSE_ICON = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';

  const imageCache = new Map();
  const PLAY_INTERVAL_MS = 700;
  const MAX_SCALE = 12;

  let frames = [];
  let currentIndex = -1;
  let animationTimer = null;
  let scale = 1, minScale = 1, tx = 0, ty = 0;
  let latestFrameId = null;
  let displayedFrameId = null;
  let imageShown = false;
  let timelineReady = false;
  let timelineLoading = false;

  function setOverlay(text, { error = false, spin = true } = {}) {
    overlay.classList.remove('hidden');
    message.textContent = text;
    message.classList.toggle('error', error);
    spinner.classList.toggle('paused', !spin);
  }

  function hideOverlay() {
    overlay.classList.add('hidden');
  }

  function updateFrameLabel() {
    const total = frames.length;
    const current = total && currentIndex >= 0 ? currentIndex + 1 : 0;
    frameLabel.textContent = `Frame ${current} of ${total}`;
    slider.max = Math.max(0, total - 1);
    slider.value = Math.max(0, currentIndex);
    const enabled = timelineReady && total > 1;
    slider.disabled = !timelineReady || total === 0;
    previousButton.disabled = !enabled;
    nextButton.disabled = !enabled;
    playPauseButton.disabled = total <= 1;
  }

  function updatePlayPauseButton() {
    const playing = animationTimer !== null;
    playPauseButton.innerHTML = playing ? PAUSE_ICON : PLAY_ICON;
    playPauseButton.setAttribute('aria-label', playing ? 'Pause animation' : 'Play animation');
  }

  function setTransportLoading(loading, text = 'Loading timeline…') {
    transport.classList.toggle('loading', loading);
    transportStatus.hidden = !loading;
    transportStatus.textContent = loading ? text : '';
  }

  function setCurrentFrame(frame) {
    if (!frame) {
      timeLabel.textContent = '';
      return;
    }
    timeLabel.textContent = new Date(frame.satellite_time).toLocaleString();
  }

  function preloadFrame(frame) {
    const cached = imageCache.get(frame.id);
    if (cached?.url === frame.image_url) return cached.promise;

    const loader = new Image();
    loader.decoding = 'async';
    const promise = new Promise((resolve, reject) => {
      loader.onload = async () => {
        try {
          await loader.decode();
        } catch {
        }
        resolve();
      };
      loader.onerror = () => {
        imageCache.delete(frame.id);
        reject(new Error(`failed to preload frame ${frame.id}`));
      };
      loader.src = frame.image_url;
    });
    imageCache.set(frame.id, { url: frame.image_url, image: loader, promise });
    return promise;
  }

  async function waitForDisplayedImage(expectedSrc) {
    const expectedUrl = new URL(expectedSrc, location.href).href;
    if (image.currentSrc === expectedUrl && image.complete && image.naturalWidth > 0) {
      return;
    }

    await new Promise((resolve, reject) => {
      const cleanup = () => {
        image.removeEventListener('load', onLoad);
        image.removeEventListener('error', onError);
      };
      const onLoad = () => {
        if (image.currentSrc === expectedUrl || image.src === expectedUrl) {
          cleanup();
          resolve();
        }
      };
      const onError = () => {
        cleanup();
        reject(new Error('display image failed to load'));
      };
      image.addEventListener('load', onLoad);
      image.addEventListener('error', onError);
    });
  }

  async function showFrame(frame, { resetView = false } = {}) {
    try {
      await preloadFrame(frame);
      image.src = frame.image_url;
      await waitForDisplayedImage(frame.image_url);
      displayedFrameId = frame.id;
      setCurrentFrame(frame);
      const needsFit = resetView || !imageShown;
      imageShown = true;
      hideOverlay();
      requestAnimationFrame(() => {
        if (needsFit) {
          fitImage();
        } else {
          image.style.visibility = 'visible';
        }
      });
    } catch {
      setOverlay('Failed to load image frame. Retrying…', { error: true });
    }
  }

  async function showFrameAt(index, options = {}) {
    if (index < 0 || index >= frames.length) return;
    currentIndex = index;
    updateFrameLabel();
    await showFrame(frames[index], options);
  }

  function stopPlayback() {
    if (animationTimer !== null) {
      clearInterval(animationTimer);
      animationTimer = null;
      updatePlayPauseButton();
    }
  }

  function startPlayback() {
    if (frames.length <= 1 || animationTimer !== null) return;
    animationTimer = setInterval(() => {
      showFrameAt((currentIndex + 1) % frames.length);
    }, PLAY_INTERVAL_MS);
    updatePlayPauseButton();
  }

  async function loadTimeline() {
    if (timelineLoading) return;
    timelineLoading = true;
    try {
      const currentFrameId =
        currentIndex >= 0 && currentIndex < frames.length ? frames[currentIndex].id : latestFrameId;
      const response = await fetch('/api/timeline');
      if (!response.ok) throw new Error('timeline request failed');
      const data = await response.json();
      const nextFrames = Array.isArray(data.frames) ? data.frames : [];
      const timelineUnchanged =
        nextFrames.length === frames.length &&
        nextFrames.every((frame, index) => frame.id === frames[index].id);
      if (timelineUnchanged) return;

      frames = nextFrames;
      latestFrameId = frames.length ? frames[frames.length - 1].id : latestFrameId;
      const activeIds = new Set(frames.map((frame) => frame.id));
      for (const frameId of imageCache.keys()) {
        if (!activeIds.has(frameId)) imageCache.delete(frameId);
      }

      timelineReady = false;
      setTransportLoading(true);
      updateFrameLabel();

      if (!frames.length) {
        timelineReady = true;
        return;
      }

      const activeIndex = frames.findIndex((frame) => frame.id === currentFrameId);
      if (activeIndex >= 0) {
        currentIndex = activeIndex;
      } else {
        currentIndex = frames.length - 1;
      }
      updateFrameLabel();

      if (!imageShown) {
        await showFrameAt(currentIndex, { resetView: true });
      }

      const activeFrame = frames[currentIndex];
      await preloadRemainingFrames(frames);
      frames = frames.filter((frame) => !frame.failed);
      latestFrameId = frames.length ? frames[frames.length - 1].id : latestFrameId;
      const restoredIndex = activeFrame ? frames.findIndex((frame) => frame.id === activeFrame.id) : -1;
      currentIndex = restoredIndex >= 0 ? restoredIndex : Math.max(0, frames.length - 1);
      timelineReady = true;
    } catch {
      // Keep the currently displayed latest image and retry on the next refresh.
    } finally {
      timelineLoading = false;
      setTransportLoading(!timelineReady);
      updateFrameLabel();
    }
  }

  async function preloadRemainingFrames(snapshot) {
    const total = snapshot.length;
    let done = 0;
    for (let index = snapshot.length - 1; index >= 0; index -= 1) {
      const frame = snapshot[index];
      done += 1;
      setTransportLoading(true, `Downloading image ${done} of ${total}`);
      try {
        await preloadFrame(frame);
      } catch {
        frame.failed = true;
      }
    }
  }

  async function refresh(kick) {
    let data;
    try {
      const response = await fetch(kick ? '/api/latest' : '/api/status',
        kick ? { method: 'POST' } : undefined);
      if (!response.ok) throw new Error('status request failed');
      data = await response.json();
    } catch {
      setOverlay('Cannot reach the server. Retrying…', { error: true });
      setTimeout(() => refresh(true), 5000);
      return;
    }

    if (data.image_available && data.image_url && data.frame_id) {
      const previousLatestFrameId = latestFrameId;
      latestFrameId = data.frame_id;
      const shouldShowLatest =
        !imageShown ||
        !frames.length ||
        displayedFrameId === null ||
        displayedFrameId === previousLatestFrameId;
      if (shouldShowLatest) {
        const latestFrame = {
          id: data.frame_id,
          generated_unix: data.generated_unix,
          satellite_time: data.satellite_time,
          image_url: data.image_url
        };
        await showFrame(latestFrame, { resetView: !imageShown });
      }
      loadTimeline();
    }

    if (data.state === 'syncing') {
      if (!imageShown) {
        setOverlay('Synchronizing the most recent visible satellite frames. This can take a moment on a cold start…');
      } else if (!timelineReady) {
        setTransportLoading(true);
      }
      setTimeout(() => refresh(false), 2500);
    } else if (data.state === 'error' && !data.image_available) {
      setOverlay(data.message, { error: true, spin: false });
      setTimeout(() => refresh(true), 30000);
    } else if (!data.image_available) {
      setOverlay('No visible images are available right now. The server will try again soon.', { spin: false });
      setTimeout(() => refresh(true), 15000);
    } else {
      setTimeout(() => refresh(false), 60000);
    }
  }

  function apply() {
    image.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  }

  function clamp() {
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    const iw = image.naturalWidth * scale, ih = image.naturalHeight * scale;
    tx = iw <= vw ? (vw - iw) / 2 : Math.min(0, Math.max(vw - iw, tx));
    ty = ih <= vh ? (vh - ih) / 2 : Math.min(0, Math.max(vh - ih, ty));
  }

  function fitImage() {
    if (!image.naturalWidth) return;
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    minScale = Math.min(vw / image.naturalWidth, vh / image.naturalHeight);
    scale = minScale;
    clamp();
    apply();
    image.style.visibility = 'visible';
    imageShown = true;
  }

  function zoomAt(x, y, factor) {
    const next = Math.min(MAX_SCALE, Math.max(minScale, scale * factor));
    factor = next / scale;
    tx = x - (x - tx) * factor;
    ty = y - (y - ty) * factor;
    scale = next;
    clamp();
    apply();
  }

  const pointers = new Map();
  let pinchDistance = 0, lastTap = 0;

  viewport.addEventListener('pointerdown', (event) => {
    viewport.setPointerCapture(event.pointerId);
    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinchDistance = Math.hypot(a.x - b.x, a.y - b.y);
    } else if (pointers.size === 1) {
      const now = Date.now();
      if (now - lastTap < 300) {
        const factor = scale < minScale * 3 ? 3 : minScale / scale;
        zoomAt(event.clientX, event.clientY, factor);
      }
      lastTap = now;
    }
  });

  viewport.addEventListener('pointermove', (event) => {
    if (!pointers.has(event.pointerId)) return;
    const previous = pointers.get(event.pointerId);
    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });

    if (pointers.size === 1) {
      tx += event.clientX - previous.x;
      ty += event.clientY - previous.y;
      clamp();
      apply();
    } else if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      const distance = Math.hypot(a.x - b.x, a.y - b.y);
      const centerX = (a.x + b.x) / 2;
      const centerY = (a.y + b.y) / 2;
      if (pinchDistance > 0) zoomAt(centerX, centerY, distance / pinchDistance);
      pinchDistance = distance;
    }
  });

  const release = (event) => {
    pointers.delete(event.pointerId);
    pinchDistance = 0;
  };
  viewport.addEventListener('pointerup', release);
  viewport.addEventListener('pointercancel', release);

  viewport.addEventListener('wheel', (event) => {
    event.preventDefault();
    zoomAt(event.clientX, event.clientY, event.deltaY < 0 ? 1.2 : 1 / 1.2);
  }, { passive: false });

  previousButton.addEventListener('click', () => {
    stopPlayback();
    showFrameAt(Math.max(0, currentIndex - 1));
  });

  nextButton.addEventListener('click', () => {
    stopPlayback();
    showFrameAt(Math.min(frames.length - 1, currentIndex + 1));
  });

  playPauseButton.addEventListener('click', () => {
    if (animationTimer !== null) {
      stopPlayback();
    } else {
      startPlayback();
    }
  });

  slider.addEventListener('input', (event) => {
    stopPlayback();
    showFrameAt(Number(event.target.value));
  });

  copyrightButton.addEventListener('click', () => {
    copyrightDialog.classList.remove('hidden');
  });

  copyrightClose.addEventListener('click', () => {
    copyrightDialog.classList.add('hidden');
  });

  copyrightDialog.addEventListener('click', (event) => {
    if (event.target === copyrightDialog) copyrightDialog.classList.add('hidden');
  });

  window.addEventListener('resize', fitImage);

  updateFrameLabel();
  updatePlayPauseButton();
  setTransportLoading(true);
  refresh(true);
})();
</script>
</body>
</html>
